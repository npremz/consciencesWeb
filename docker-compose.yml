services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4324:4324"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4324
      - RESEND_API_KEY=${RESEND_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4324/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
